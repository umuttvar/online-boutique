apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
spec:
  replicas: {{$.Values.services.paymentservice.replicas}}
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
      - name: paymentservice
        image:  "{{ $.Values.registry }}/paymentservice:{{ $.Values.tag }}"
        ports: 
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
spec:
  selector:
    app: paymentservice
  ports:
  - port: 50051
    targetPort: 50051