apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  replicas: {{$.Values.services.emailservice.replicas}}
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
      - name: emailservice
        image:  "{{ $.Values.registry }}/emailservice:{{ $.Values.tag }}"
        ports: 
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DISABLE_PROFILER
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
spec:
  selector:
    app: emailservice
  ports:
  - port: 8080
    targetPort: 8080