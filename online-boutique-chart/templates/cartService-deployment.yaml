apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
spec:
  replicas: {{$.Values.services.cartservice.replicas}}
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      containers:
      - name: cartservice
        image: "{{ $.Values.registry }}/cartservice:{{ $.Values.tag }}"
        ports: 
        - containerPort: 7070
        env: 
        - name: REDIS_ADDR
          value: "redis-cart:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
spec:
  selector:
    app: cartservice
  ports:
  - port: 7070
    targetPort: 7070