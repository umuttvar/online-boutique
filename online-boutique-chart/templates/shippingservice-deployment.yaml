apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
spec:
  replicas: {{$.Values.services.shippingservice.replicas}}
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      containers:
      - name: shippingservice
        image:  "{{ $.Values.registry }}/shippingservice:{{ $.Values.tag }}"
        ports: 
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
spec:
  selector:
    app: shippingservice
  ports:
  - port: 50051
    targetPort: 50051